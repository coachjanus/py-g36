{% extends 'base.html' %}

<div class="container">
    {% block header %}
    <div class="d-flex justify-content-between mt-2 align-items-center">
        <h2>Hire new Employee</h2>
        
    </div>

    {% endblock header %}
</div>

{% block content %}
<div class="container">
    <form method="post">
        <div class="mb-3">
            <label for="employee_name" class="form-label">Employee name</label>
            <input type="text" class="form-control" id="employee_name"  required  name="employee_name">
        </div>
        <div class="input-group mb-3">
            <select class="form-select" name="department_id">
                <option>Choose department</option>
                {% for item in departments %}
                <option value="{{item.id}}">{{ item.department_name }}</option>
                {% endfor %}
            </select>
           
            <select class="form-select" name="role_id">
                <option selected>Choose role</option>
                {% for item in roles %}
                <option value="{{ item.id }}">{{ item.role_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label for="weekly_salary" class="form-label">Weekly salary</label>
                <input type="number" class="form-control" id="weekly_salary" name="weekly_salary">
            </div>
            <div class="col">
                <label for="commission_per_sale" class="form-label">Commission per sale</label>
                <input type="number" class="form-control" id="commission_per_sale" name="commission_per_sale">
            </div>
            <div class="col">
                <label for="weekly_salary" class="form-label">Hour rate</label>
                <input type="number" class="form-control" id="hour_rate" name="hour_rate">
            </div>
        </div>
        <div class="form-group"> 
            <input type="submit" value="Create employee" class="btn btn-danger"> 
        </div>
      </form>

</div>

{% endblock content %}
